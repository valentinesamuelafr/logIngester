version: '3'

dotenv: ['.env']

vars:
  VENV_DIR: .venv
  PYTHON: "{{.VENV_DIR}}/bin/python"
  PIP: "{{.VENV_DIR}}/bin/pip"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  venv:
    desc: Create a Python venv at ./.venv and install scripts/requirements.txt into it
    status:
      - test -f {{.VENV_DIR}}/.installed
    sources:
      - scripts/requirements.txt
    generates:
      - "{{.VENV_DIR}}/.installed"
    cmds:
      - python3 -m venv {{.VENV_DIR}}
      - "{{.PIP}} install --upgrade pip"
      - "{{.PIP}} install -r scripts/requirements.txt"
      - touch {{.VENV_DIR}}/.installed

  shell:
    desc: Drop into a subshell with the venv activated (run `exit` to leave it)
    deps:
      - venv
    interactive: true
    cmds:
      - bash -c "source {{.VENV_DIR}}/bin/activate && exec ${SHELL:-bash}"

  docker:start:
    desc: Start Elasticsearch + Kibana via Docker Compose
    cmds:
      - docker compose up -d

  es:health:
    desc: Check Elasticsearch cluster health (uses ELASTIC_PASSWORD from .env automatically)
    cmds:
      - curl -s -u elastic:$ELASTIC_PASSWORD http://localhost:9200/_cluster/health?pretty

  es:clean-data:
    desc: Delete all documents from Elasticsearch data indices (keeps mappings/settings and containers running)
    cmds:
      - |
        curl -s -u elastic:$ELASTIC_PASSWORD -X POST "http://localhost:9200/*,-.*/_delete_by_query?conflicts=proceed&refresh=true&pretty" \
          -H 'Content-Type: application/json' \
          -d '{"query":{"match_all":{}}}'

  docker:stop:
    desc: Stop containers but keep the esdata volume (data survives)
    cmds:
      - docker compose stop

  docker:clean:
    desc: Stop and remove containers AND the esdata volume (full reset, data is destroyed)
    cmds:
      - docker compose down -v

  clean:
    desc: Wipe all ingested Elasticsearch data and bring the stack back up empty, ready for a fresh reload
    cmds:
      - task: docker:clean
      - task: docker:start

  load:
    desc: Ingest everything under data/kuja and data/vantage into Elasticsearch (make sure the stack is running first)
    cmds:
      - task: load:kuja
      - task: load:vantage

  load:kuja:
    desc: Ingest data/kuja/ (*.log as app-container-logs, *.json.gz as datadog-logs)
    deps:
      - venv
    cmds:
      - |
        for f in data/kuja/*.log; do
          [ -e "$f" ] || continue
          echo "Ingesting $f as dataset app-container-logs"
          {{.PYTHON}} scripts/ingest.py "$f" --dataset app-container-logs
        done
      - |
        for f in data/kuja/*.json.gz; do
          [ -e "$f" ] || continue
          echo "Ingesting $f as dataset datadog-logs"
          {{.PYTHON}} scripts/ingest.py "$f" --dataset datadog-logs
        done
      - |
        for f in data/kuja/*; do
          [ -e "$f" ] || continue
          case "$f" in
            *.log|*.json.gz) ;;
            *) echo "Skipping $f: no dataset mapping known for this file type. Run manually: {{.PYTHON}} scripts/ingest.py \"$f\" --dataset <name>" ;;
          esac
        done

  load:vantage:
    desc: Ingest data/vantage/*.log as dataset cxc-vantage-logs (idempotent, safe to re-run)
    deps:
      - venv
    cmds:
      - |
        for f in data/vantage/*.log; do
          [ -e "$f" ] || continue
          echo "Ingesting $f as dataset cxc-vantage-logs"
          {{.PYTHON}} scripts/ingest.py "$f" --dataset cxc-vantage-logs
        done
      - |
        P=$ELASTIC_PASSWORD
        curl -s -u elastic:$P -X POST "http://localhost:9200/cxc-vantage-logs/_refresh" >/dev/null
        echo "Docs per service (and how many carry unmapped extras in meta):"
        curl -s -u elastic:$P "http://localhost:9200/cxc-vantage-logs/_search" -H 'Content-Type: application/json' \
          -d '{"size":0,"aggs":{"svc":{"terms":{"field":"service","size":50},"aggs":{"with_meta":{"filter":{"exists":{"field":"meta"}}}}}}}' \
          | {{.PYTHON}} -c "import sys,json; [print(f'  {b[\"key\"]}: {b[\"doc_count\"]} docs, {b[\"with_meta\"][\"doc_count\"]} with meta') for b in json.load(sys.stdin)['aggregations']['svc']['buckets']]"

  kibana:setup:
    desc: Create the Kibana data views and saved searches for cxc-vantage-logs (idempotent)
    deps:
      - venv
    cmds:
      - "{{.PYTHON}} scripts/kibana_setup.py"
